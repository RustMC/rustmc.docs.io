# Builds and checks the site on every pull request; on pushes to main, every
# hour and on demand it also deploys to GitHub Pages.
name: site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: v0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RustMC/RustMC
          ref: main
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      # The workflow token cannot read a user's Sponsors listing; with a
      # SPONSORS_TOKEN secret (read-only personal token) the data is refreshed,
      # otherwise the committed data/sponsors.json is used.
      - name: Refresh sponsors
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        if: env.GH_TOKEN != ''
        run: python3 scripts/fetch_sponsors.py
      - name: Install Zola
        run: |
          archive="zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/${archive}"
          echo "${ZOLA_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive"
      - name: Generate content from RustMC
        run: python3 scripts/build_content.py upstream
      - name: Build
        run: ./zola build
      - name: Check accessibility and colours
        run: python3 scripts/check_site.py public static/css/site.css
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --root-dir "${{ github.workspace }}/public" --no-progress "public/**/*.html"
          fail: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
