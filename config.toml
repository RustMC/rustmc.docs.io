# Zola configuration for the RustMC documentation site, served by GitHub Pages
# under the repository path.
base_url = "https://rustmc.github.io/rustmc.docs.io"
title = "RustMC"
description = "RustMC: a Minecraft Java Edition 26.3 server written in Rust."
default_language = "en"
compile_sass = false
minify_html = true
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = false
external_links_no_follow = false
external_links_no_referrer = true

[extra]
repository = "https://github.com/RustMC/RustMC"
site_repository = "https://github.com/RustMC/rustmc.docs.io"
sponsors = "https://github.com/sponsors/neonjava"
